name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@10949f31af0fda1a97cfe4db719a0b883ad840d0 # mint main @ mint#54
    with:
      ref: 10949f31af0fda1a97cfe4db719a0b883ad840d0
