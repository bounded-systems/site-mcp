name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@44d61e153a0c0bdbe44ce651f8bea4defe8ede51 # mint v0.7.2
    with:
      ref: 44d61e153a0c0bdbe44ce651f8bea4defe8ede51
