name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@01951d98a708211d5708c46ef698deec4629d60d # mint 0.7.0
    with:
      ref: 01951d98a708211d5708c46ef698deec4629d60d
