name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@66e3b42693355c9e7be82b319fb6eb8a838d0bce # mint main @ mint#49
    with:
      ref: 66e3b42693355c9e7be82b319fb6eb8a838d0bce
