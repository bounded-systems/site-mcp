name: version

# Versioning via the bounded-systems mint capability. Validates .release/ intents
# (fails closed on a malformed one) and previews the next version on every PR.
# Pinned to an immutable mint commit SHA; bump when mint tags.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    uses: bounded-systems/mint/.github/workflows/version.yml@24123b15eb63c6c3b59ca1b61a17c98130afd62b # mint main @ mint#54
    with:
      ref: b2d319d8e8eacbd80a3cb849daf7a53aa88802ee
