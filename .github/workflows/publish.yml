name: publish

# ONE tag -> THREE registries, mirrored.
#
# Pushing a `v*` tag (e.g. `v0.1.0`) publishes the SAME version to:
#   1. npm  (@bounded-systems/site-mcp)        - trusted publishing (OIDC) + provenance
#   2. JSR  (@bounded-systems/site-mcp)        - tokenless OIDC publish (mirror of npm)
#   3. MCP Registry (io.github.bounded-systems/site-mcp) - GitHub-OIDC namespace auth
#
# No long-lived secrets: every registry authenticates via the job's short-lived
# GitHub Actions OIDC token (`id-token: write`). The `verify` job hard-fails the
# whole release unless package.json, deno.json, server.json and the tag all
# carry the SAME version, so npm and JSR can never drift apart.
#
# TWO WAYS IN, ONE SOURCE OF TRUTH FOR THE TAG (#33):
#   push: tags     - a tag cut from a checkout. `github.ref_name` is the tag.
#   workflow_call  - chained after `release-cut` by cut.yml. That run's event is
#                    workflow_dispatch on a BRANCH, so `github.ref_name` is the
#                    branch and the caller MUST pass the cut tag instead.
# Every job below checks out `inputs.tag || github.ref_name`, so the two paths
# cannot diverge. Without the pin, a chained run would verify, build and publish
# main under a version tag's name.

on:
  push:
    tags:
      - "v*"
  # Standalone dispatch is the RECOVERY door: a release whose tag and GitHub
  # release exist but whose registries did not all land (v0.3.0, #38). It takes
  # the same tag input as workflow_call for the same reason — a dispatch runs on
  # a BRANCH, so without it every job checks out main and publishes whatever has
  # landed there since, under the version tag's name. Leave it empty only to
  # publish the current branch state deliberately.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.3.0. Empty = the current branch."
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: >-
          The v<version> tag to publish. Defaults to the triggering ref, which is
          correct for the tag-push path. A chained caller MUST pass it — see the
          header.
        type: string
        default: ""

jobs:
  # ---------------------------------------------------------------------------
  # Gate: all four version sources must agree before anything is published.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Versions must match (package.json == deno.json == server.json == tag)
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          deno=$(jq -r .version deno.json)
          srv=$(jq -r .version server.json)
          # server.json carries the version TWICE: its own, and the npm version the
          # MCP Registry entry tells clients to install. Only the first was checked,
          # so a release could ship a 0.3.0 registry entry pointing at 0.2.0 on npm —
          # silently serving the previous build to every client that found it there.
          srvpkg=$(jq -r '.packages[0].version' server.json)
          # $TAG is a real tag on a tag push AND on a chained workflow_call. It is
          # a BRANCH name only on a bare workflow_dispatch, where there is nothing
          # to compare against — say that out loud rather than comparing $pkg to
          # itself and reporting a green check that gated nothing.
          case "$TAG" in
            v[0-9]*) tag="${TAG#v}" ;;
            *)
              tag="$pkg"
              echo "::notice::no tag in scope (ref '$TAG') — comparing the three manifests only, not a tag" ;;
          esac
          echo "package.json=$pkg deno.json=$deno server.json=$srv server.json:packages[0]=$srvpkg tag=$tag"
          if [ "$pkg" != "$deno" ] || [ "$pkg" != "$srv" ] || [ "$pkg" != "$srvpkg" ] || [ "$pkg" != "$tag" ]; then
            echo "::error::version mismatch — keep package.json, deno.json, server.json (both version fields) and the v<version> tag in sync"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 1. npm — trusted publishing (OIDC) + provenance. Requires npm >= 11.5.
  # ---------------------------------------------------------------------------
  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish auth
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # ASSERT, DO NOT MUTATE. This was `npm install -g npm@latest`, and that
      # unpinned upgrade is what broke the v0.3.0 release: a newer npm disables
      # remote-tarball dependencies by default, and this lockfile resolves the
      # JSR npm-compat deps to https://npm.jsr.io/... tarballs, so `npm ci` died
      # with EALLOWREMOTE before anything was published.
      #
      # The step was also unnecessary — setup-node's Node 24 already ships npm
      # 11.17.0, well past the 11.5 that trusted publishing needs. So the fix is
      # to check the floor and fail loudly if a future runner drops below it,
      # rather than pulling an unreviewed npm into the release path.
      - name: Assert npm >= 11.5 (trusted publishing)
        run: |
          set -euo pipefail
          have=$(npm --version)
          echo "npm $have"
          if [ "$(printf '%s\n11.5.0\n' "$have" | sort -V | head -1)" != "11.5.0" ]; then
            echo "::error::npm $have is below 11.5, which trusted publishing requires." \
                 "Raise node-version rather than installing npm globally here."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Idempotent. A partial release has to be recoverable by re-dispatching
      # this workflow, and npm refuses to republish an existing version — so on
      # a recovery run the already-published registry is a SKIP, not a failure.
      - name: Already on npm?
        id: onnpm
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::npm already has $name@$version — skipping the publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NPM_TOKEN: npm performs the OIDC exchange with the trusted-publisher
      # endpoint and attaches provenance automatically.
      - name: Publish to npm (trusted publishing + provenance)
        if: steps.onnpm.outputs.skip != 'true'
        run: npm publish --provenance --access public

  # ---------------------------------------------------------------------------
  # 2. JSR — tokenless OIDC publish. Mirrors the npm release (same version).
  #    JSR publishes the built `dist/` entry (Node-targeted source); the JS
  #    entrypoint needs --allow-slow-types.
  # ---------------------------------------------------------------------------
  jsr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # tokenless OIDC publish to JSR
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build (deno.json exports ./dist/index.js)
        run: npm run build

      # Same idempotence, and here it is load-bearing rather than tidy: JSR
      # versions are IMMUTABLE. v0.3.0 reached JSR while the npm job was failing,
      # so a recovery dispatch that re-attempted this would go red on a release
      # that had in fact succeeded — reporting failure for the one registry that
      # worked.
      - name: Already on JSR?
        id: onjsr
        run: |
          set -euo pipefail
          pkg=$(jq -r .name deno.json)     # @scope/name
          version=$(jq -r .version deno.json)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://jsr.io/${pkg}/${version}_meta.json")
          if [ "$code" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::JSR already has $pkg@$version — skipping the publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to JSR (OIDC)
        if: steps.onjsr.outputs.skip != 'true'
        run: npx --yes jsr publish --allow-slow-types

  # ---------------------------------------------------------------------------
  # 3. MCP Registry — GitHub-OIDC namespace auth (io.github.bounded-systems/*).
  #    Decoupled from the `npm` job: the registry verifies package ownership by
  #    reading the `mcpName` field of the ALREADY-published npm package, so it
  #    does not require this run's npm job to succeed (npm trusted publishing is
  #    not configured in CI). Trigger standalone via `workflow_dispatch` to list
  #    or re-list once the npm package exists.
  # ---------------------------------------------------------------------------
  mcp-registry:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> io.github.bounded-systems/* namespace
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # No pinnable SHA: the publisher binary must be the LATEST release or the
      # OIDC audience check fails ("invalid audience"). Hence `releases/latest`.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json against the published schema
        run: ./mcp-publisher validate ./server.json

      - name: Authenticate (GitHub OIDC; auto-authes io.github.bounded-systems/*)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
